<div class="row">
  <div class="col-6">
    <p class="mb-0">Render HTML</p>
    <div class="highlight">
      <pre class="chroma rounded mb-0">
        <code class="language-html" data-lang="html">
{<span></span>% with mytext='Hello my friend, do you like DJANGO' %}
  {<span></span>{ mytext|truncatechars:10 }}
{<span></span>% endwith %}
        </code>
      </pre>
    </div>
  </div>
  <div class="col-6">
    <p class="mb-0">Kết quả</p>
    <div class="p-3 bg-label-primary mt-4">
      {% with mytext='Hello my friend, do you like DJANGO' %}
        {{ mytext|truncatechars:10 }}
      {% endwith %}
    </div>
  </div>
</div>
