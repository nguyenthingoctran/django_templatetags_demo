<div class="row">
  <div class="col-6">
    <p class="mb-0">Render HTML</p>
    <div class="highlight">
      <pre class="chroma rounded mb-0">
        <code class="language-html" data-lang="html">
{<span></span>% with url='https://www.example.org/foo?a=b&c=d' %}
  {<span></span>{ url|urlencode }}
{<span></span>% endwith %}
        </code>
      </pre>
    </div>
  </div>
  <div class="col-6">
    <p class="mb-0">Kết quả</p>
    <div class="p-3 bg-label-primary mt-4">
      {% with url='https://www.example.org/foo?a=b&c=d' %}
        {{ url|urlencode }}
      {% endwith %}
    </div>
  </div>
</div>
