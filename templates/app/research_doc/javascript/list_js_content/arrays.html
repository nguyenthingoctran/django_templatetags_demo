<div class="tab-pane fade" id="js-array" role="tabpanel">
  <div class="card mb-6">
    <div class="card-body">
      <h5 class="card-title mb-1">Array</h5>

      <div class="border rounded px-5 py-5 mb-5">
        <div class="accordion accordion-flush accordion-arrow-left">
          {% for array in array_list %}
            <div class="accordion-item border-bottom">
              <div
                class="accordion-header d-flex justify-content-between align-items-center flex-wrap flex-sm-nowrap"
                id="listArrayItem">
                <a
                  class="accordion-button collapsed"
                  data-bs-toggle="collapse"
                  data-bs-target="#{{ array.data_bs_target }}"
                  aria-expanded="false"
                  aria-controls="listArrayItem"
                  role="button">
                    <span class="d-flex gap-2">
                      <span class="h6 mb-1">{{ array.name }}</span>
                    </span>
                </a>
              </div>
              <div
                id="{{ array.data_bs_target }}"
                class="accordion-collapse collapse">
                <div class="accordion-body ps-6 ms-1">
                  {% include array.include_template %}
                </div>
              </div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
