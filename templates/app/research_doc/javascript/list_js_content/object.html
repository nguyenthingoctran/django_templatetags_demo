<div class="tab-pane fade" id="js-object" role="tabpanel">
  <div class="card mb-6">
    <div class="card-body">
      <h5 class="card-title mb-1">Object</h5>

      <div class="border rounded px-5 py-5 mb-5">
        <h6>1. Constructor</h6>

        <div class="accordion accordion-flush accordion-arrow-left">
          {% for object in object_list %}
            <div class="accordion-item border-bottom">
              <div
                class="accordion-header d-flex justify-content-between align-items-center flex-wrap flex-sm-nowrap"
                id="headingHome">
                <a
                  class="accordion-button collapsed"
                  data-bs-toggle="collapse"
                  data-bs-target="#{{ object.data_bs_target }}"
                  aria-expanded="false"
                  aria-controls="headingHome"
                  role="button">
                    <span class="d-flex gap-2">
                      <span class="h6 mb-1">{{ object.name }}</span>
                    </span>
                </a>
              </div>
              <div
                id="{{ object.data_bs_target }}"
                class="accordion-collapse collapse">
                <div class="accordion-body ps-6 ms-1">
                  {% include object.include_template %}
                </div>
              </div>
            </div>
          {% endfor %}
        </div>

        <br/>
        <h6 class="mt-5">2. Static methods</h6>
        <div class="accordion accordion-flush accordion-arrow-left">
          {% for object in static_method %}
            <div class="accordion-item border-bottom">
              <div
                class="accordion-header d-flex justify-content-between align-items-center flex-wrap flex-sm-nowrap"
                id="static-method">
                <a
                  class="accordion-button collapsed"
                  data-bs-toggle="collapse"
                  data-bs-target="#{{ object.data_bs_target }}"
                  aria-expanded="false"
                  aria-controls="static-method"
                  role="button">
                    <span class="d-flex gap-2">
                      <span class="h6 mb-1">{{ object.name }}</span>
                    </span>
                </a>
              </div>
              <div
                id="{{ object.data_bs_target }}"
                class="accordion-collapse collapse">
                <div class="accordion-body ps-6 ms-1">
                  {% include object.include_template %}
                </div>
              </div>
            </div>
          {% endfor %}
        </div>

      </div>
    </div>
  </div>
</div>
